<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mesh Simplifier (Safe Compression)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { overflow: hidden; background-color: #121214; color: #e4e4e7; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 340px;
            background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
            padding: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); z-index: 10;
            max-height: 90vh; overflow-y: auto;
        }
        
        #ui-panel::-webkit-scrollbar { width: 6px; }
        #ui-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        #ui-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; color: #f4f4f5; }
        p.subtitle { font-size: 0.8rem; color: #a1a1aa; margin-bottom: 16px; }
        .section { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: #d4d4d8; }
        .slider-val { color: #38bdf8; font-weight: 600; }
        input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: #27272a; outline: none; accent-color: #38bdf8; cursor: pointer; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-group-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
        .btn-group-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; margin-top: 10px; }
        .header-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        
        button, label.file-btn {
            display: flex; align-items: center; justify-content: center; padding: 9px 8px;
            background: #27272a; color: #f4f4f5; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; text-align: center;
        }
        button:hover:not(:disabled), label.file-btn:hover { background: #3f3f46; border-color: rgba(255, 255, 255, 0.2); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        button.primary { background: #0284c7; border-color: #0369a1; font-size: 0.825rem; }
        button.primary:hover:not(:disabled) { background: #0369a1; }
        button.success { background: #059669; border-color: #047857; font-size: 0.825rem; }
        button.success:hover:not(:disabled) { background: #047857; }
        button.active-tool { background: #0ea5e9; border-color: #0284c7; color: white; }

        input[type="file"] { display: none; }
        .stats-box { background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 10px 12px; font-size: 0.8rem; line-height: 1.6; }
        .stats-row { display: flex; justify-content: space-between; }
        .stats-val { font-family: monospace; font-weight: 600; color: #38bdf8; }
        
        #loading-overlay {
            position: absolute; top: 20px; right: 20px; background: rgba(24, 24, 27, 0.9);
            border: 1px solid #0284c7; color: #38bdf8; padding: 8px 16px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 500; display: none; align-items: center; gap: 8px; z-index: 20;
        }
        .spinner {
            width: 12px; height: 12px; border: 2px solid #38bdf8; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-text">Memproses...</span>
    </div>

    <div id="ui-panel">
        <h2>Mesh Simplifier Pro</h2>
        <p class="subtitle">Safe MAX Compression (Universal)</p>

        <!-- Upload & Demo -->
        <div class="section">
            <div class="btn-group" style="grid-template-columns: 1fr;">
                <label class="file-btn" style="font-size: 0.825rem;">
                    📁 Upload Model (.OBJ, .GLB, .FBX)
                    <input type="file" id="fileInput" accept=".obj,.glb,.gltf,.fbx">
                </label>
                <button id="resetDemoBtn" style="font-size: 0.825rem;">🔄 Load Sample Demo</button>
            </div>
        </div>

        <!-- Transform Controls -->
        <div class="section">
            <div class="header-group">
                <label style="margin: 0;">Alat Transformasi</label>
                <button id="undoBtn" style="padding: 4px 8px; background: #b91c1c; border-color: #991b1b;" disabled>↩ Undo</button>
            </div>
            <div class="btn-group-4">
                <button id="toolView" class="active-tool" title="View Only">View</button>
                <button id="toolMove" title="Geser Objek">Geser</button>
                <button id="toolRotate" title="Putar Objek">Putar</button>
                <button id="toolScale" title="Ubah Skala">Skala</button>
            </div>
        </div>

        <!-- Percentage -->
        <div class="section">
            <label>
                <span>Pengurangan Polygon</span>
                <span class="slider-val" id="percentDisplay">50%</span>
            </label>
            <input type="range" id="reductionSlider" min="5" max="90" step="5" value="50">
            <div class="btn-group">
                <button id="applyBtn" class="primary">Terapkan</button>
                <button id="resetMeshBtn">Reset ke Asli</button>
            </div>
        </div>

        <!-- View Settings -->
        <div class="section">
            <div class="btn-group-3">
                <button id="textureBtn" data-active="true" style="background: #0284c7;">Tekstur</button>
                <button id="wireframeBtn" data-active="false">Wireframe</button>
                <button id="shadingBtn" data-active="false">Smooth</button>
            </div>
        </div>

        <!-- Stats & Export -->
        <div class="section">
            <div class="stats-box">
                <div class="stats-row"><span>Vertex Asli:</span><span class="stats-val" id="origVerts">0</span></div>
                <div class="stats-row"><span>Vertex Hasil:</span><span class="stats-val" id="currVerts">0</span></div>
                <div class="stats-row"><span>Total Reduksi:</span><span class="stats-val" id="reducedPct">0%</span></div>
            </div>
            
            <label style="margin-top: 12px; margin-bottom: 4px;">Ekspor (Optimized):</label>
            <div class="btn-group">
                <button id="exportObjBtn" class="success">💾 Raw .OBJ</button>
                <button id="exportGlbBtn" class="success" style="background:#0d9488; border-color:#0f766e;">📦 Safe .GLB</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@gltf-transform/core": "https://esm.sh/@gltf-transform/core@3.10.1",
                "@gltf-transform/extensions": "https://esm.sh/@gltf-transform/extensions@3.10.1",
                "@gltf-transform/functions": "https://esm.sh/@gltf-transform/functions@3.10.1"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { SimplifyModifier } from 'three/addons/modifiers/SimplifyModifier.js';
        
        // --- glTF-Transform Imports (Tanpa Meshopt) ---
        import { WebIO } from '@gltf-transform/core';
        import { KHRONOS_EXTENSIONS } from '@gltf-transform/extensions';
        import { weld, quantize, dedup, prune } from '@gltf-transform/functions';

        let scene, camera, renderer, controls, transformControl;
        let currentMesh = null; let originalGeometry = null; 
        let loadedMaterial = null; let isTextureOn = true;    
        const modifier = new SimplifyModifier();

        const historyStack = []; const MAX_HISTORY = 10; let initialTransformState = null;
        const defaultMaterial = new THREE.MeshStandardMaterial({
            color: 0x88ccff, wireframe: false, roughness: 0.5, metalness: 0.1, side: THREE.DoubleSide
        });

        const slider = document.getElementById('reductionSlider'); const percentDisplay = document.getElementById('percentDisplay');
        const applyBtn = document.getElementById('applyBtn'); const resetMeshBtn = document.getElementById('resetMeshBtn');
        const undoBtn = document.getElementById('undoBtn'); const textureBtn = document.getElementById('textureBtn');
        const wireframeBtn = document.getElementById('wireframeBtn'); const shadingBtn = document.getElementById('shadingBtn');
        const toolView = document.getElementById('toolView'); const toolMove = document.getElementById('toolMove');
        const toolRotate = document.getElementById('toolRotate'); const toolScale = document.getElementById('toolScale');
        const fileInput = document.getElementById('fileInput'); const resetDemoBtn = document.getElementById('resetDemoBtn');
        const exportObjBtn = document.getElementById('exportObjBtn'); const exportGlbBtn = document.getElementById('exportGlbBtn');
        const loadingOverlay = document.getElementById('loading-overlay'); const loadingText = document.getElementById('loading-text');

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x121214);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 2, 5);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace; 
            container.appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.05;

            transformControl = new TransformControls(camera, renderer.domElement);
            transformControl.addEventListener('dragging-changed', function (event) {
                controls.enabled = !event.value;
                if (event.value && currentMesh) { 
                    initialTransformState = { position: currentMesh.position.clone(), rotation: currentMesh.rotation.clone(), scale: currentMesh.scale.clone() };
                } else if (!event.value && initialTransformState) {
                    saveToHistory({ type: 'transform', ...initialTransformState }); initialTransformState = null;
                }
            });
            scene.add(transformControl);

            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5); dirLight1.position.set(5, 10, 7); scene.add(dirLight1);
            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8); dirLight2.position.set(-5, -5, -5); scene.add(dirLight2);
            const grid = new THREE.GridHelper(10, 20, 0x3f3f46, 0x27272a); grid.position.y = -1.2; scene.add(grid);

            loadDemoMesh(); window.addEventListener('resize', onWindowResize); setupUIEventListeners(); animate();
        }

        function saveToHistory(state) {
            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) { const removed = historyStack.shift(); if (removed.type === 'mesh') removed.geometry.dispose(); }
            updateUndoUI();
        }

        function performUndo() {
            if (historyStack.length === 0 || !currentMesh) return;
            const lastState = historyStack.pop();
            if (lastState.type === 'transform') {
                currentMesh.position.copy(lastState.position); currentMesh.rotation.copy(lastState.rotation); currentMesh.scale.copy(lastState.scale);
            } else if (lastState.type === 'mesh') {
                currentMesh.geometry.dispose(); currentMesh.geometry = lastState.geometry; currentMesh.geometry.computeVertexNormals();
                updateStats(originalGeometry.attributes.position.count, currentMesh.geometry.attributes.position.count);
            }
            if (transformControl.object) { transformControl.detach(); transformControl.attach(currentMesh); }
            updateUndoUI();
        }

        function updateUndoUI() { undoBtn.disabled = historyStack.length === 0; }
        function clearHistory() { historyStack.forEach(state => { if (state.type === 'mesh') state.geometry.dispose(); }); historyStack.length = 0; updateUndoUI(); }

        function setMesh(geometry, sourceMaterial = null) {
            showLoading("Menyiapkan mesh...");
            setTimeout(() => {
                clearHistory(); 
                if (currentMesh) { transformControl.detach(); scene.remove(currentMesh); currentMesh.geometry.dispose(); }
                if (!geometry.isBufferGeometry) geometry = new THREE.BufferGeometry().fromGeometry(geometry);
                geometry.center(); geometry.computeVertexNormals(); geometry.computeBoundingSphere();
                const radius = geometry.boundingSphere.radius; const scale = 1.8 / (radius || 1);
                
                originalGeometry = geometry.clone(); loadedMaterial = sourceMaterial ? sourceMaterial : defaultMaterial;
                const activeMat = isTextureOn ? loadedMaterial : defaultMaterial;
                currentMesh = new THREE.Mesh(geometry, activeMat); currentMesh.scale.set(scale, scale, scale); scene.add(currentMesh);
                if (transformControl.mode !== '' && toolView.className !== 'active-tool') transformControl.attach(currentMesh);
                
                applyCurrentMaterialStates(); updateStats(originalGeometry.attributes.position.count, originalGeometry.attributes.position.count); hideLoading();
            }, 50);
        }

        function applyCurrentMaterialStates() {
            if (!currentMesh) return;
            const isWireframe = wireframeBtn.dataset.active === 'true'; const isSmooth = shadingBtn.dataset.active === 'true';
            const applyState = (mat) => { mat.wireframe = isWireframe; mat.flatShading = isSmooth; mat.needsUpdate = true; };
            if (Array.isArray(currentMesh.material)) currentMesh.material.forEach(applyState); else applyState(currentMesh.material);
        }

        function loadDemoMesh() { setMesh(new THREE.TorusKnotGeometry(1, 0.35, 128, 32), defaultMaterial); }

        function applySimplification() {
            if (!originalGeometry || !currentMesh) return;
            const reductionPercent = parseInt(slider.value);
            saveToHistory({ type: 'mesh', geometry: currentMesh.geometry.clone() });
            showLoading(`Menyederhanakan (${reductionPercent}%)...`);
            setTimeout(() => {
                try {
                    const origVertCount = originalGeometry.attributes.position.count;
                    const targetCount = Math.max(4, Math.floor(origVertCount * ((100 - reductionPercent) / 100)));
                    const simplifiedGeo = modifier.modify(originalGeometry, targetCount);
                    currentMesh.geometry.dispose(); currentMesh.geometry = simplifiedGeo; currentMesh.geometry.computeVertexNormals();
                    updateStats(origVertCount, simplifiedGeo.attributes.position.count);
                } catch (err) { console.error(err); alert("Gagal memproses."); } finally { hideLoading(); }
            }, 60);
        }

        function resetToOriginal() {
            if (!originalGeometry || !currentMesh) return;
            saveToHistory({ type: 'mesh', geometry: currentMesh.geometry.clone() });
            currentMesh.geometry.dispose(); currentMesh.geometry = originalGeometry.clone();
            slider.value = 50; percentDisplay.textContent = "50%";
            updateStats(originalGeometry.attributes.position.count, originalGeometry.attributes.position.count);
        }

        function resetToolButtons() { [toolView, toolMove, toolRotate, toolScale].forEach(btn => btn.classList.remove('active-tool')); }

        function setupUIEventListeners() {
            slider.addEventListener('input', (e) => percentDisplay.textContent = `${e.target.value}%`);
            slider.addEventListener('change', applySimplification); applyBtn.addEventListener('click', applySimplification); resetMeshBtn.addEventListener('click', resetToOriginal);
            undoBtn.addEventListener('click', performUndo); window.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'z') performUndo(); });

            toolView.addEventListener('click', () => { resetToolButtons(); toolView.classList.add('active-tool'); transformControl.detach(); });
            toolMove.addEventListener('click', () => { resetToolButtons(); toolMove.classList.add('active-tool'); transformControl.setMode('translate'); if (currentMesh) transformControl.attach(currentMesh); });
            toolRotate.addEventListener('click', () => { resetToolButtons(); toolRotate.classList.add('active-tool'); transformControl.setMode('rotate'); if (currentMesh) transformControl.attach(currentMesh); });
            toolScale.addEventListener('click', () => { resetToolButtons(); toolScale.classList.add('active-tool'); transformControl.setMode('scale'); if (currentMesh) transformControl.attach(currentMesh); });

            textureBtn.addEventListener('click', () => {
                if (!currentMesh) return; isTextureOn = !isTextureOn; textureBtn.dataset.active = isTextureOn;
                textureBtn.style.background = isTextureOn ? '#0284c7' : '#27272a';
                currentMesh.material = isTextureOn ? loadedMaterial : defaultMaterial; applyCurrentMaterialStates(); 
            });
            wireframeBtn.addEventListener('click', () => {
                wireframeBtn.dataset.active = wireframeBtn.dataset.active !== 'true';
                wireframeBtn.style.background = wireframeBtn.dataset.active === 'true' ? '#0284c7' : '#27272a'; applyCurrentMaterialStates();
            });
            shadingBtn.addEventListener('click', () => {
                shadingBtn.dataset.active = shadingBtn.dataset.active !== 'true';
                shadingBtn.style.background = shadingBtn.dataset.active === 'true' ? '#0284c7' : '#27272a'; applyCurrentMaterialStates();
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0]; if (!file) return; showLoading("Membaca file " + file.name + "...");
                const fileURL = URL.createObjectURL(file);
                const extractAndSetMesh = (object) => {
                    let foundMesh = null; const root = object.scene || object;
                    root.traverse((child) => { if (child.isMesh && !foundMesh) foundMesh = child; });
                    if (foundMesh && foundMesh.geometry) setMesh(foundMesh.geometry.clone(), foundMesh.material); else alert("Tidak ditemukan Mesh 3D.");
                    hideLoading(); URL.revokeObjectURL(fileURL);
                };
                if (file.name.toLowerCase().endsWith('.obj')) new OBJLoader().load(fileURL, extractAndSetMesh, undefined, () => { alert("Gagal membaca file!"); hideLoading(); });
                else if (file.name.toLowerCase().endsWith('.glb') || file.name.toLowerCase().endsWith('.gltf')) new GLTFLoader().load(fileURL, extractAndSetMesh, undefined, () => { alert("Gagal membaca file!"); hideLoading(); });
                else if (file.name.toLowerCase().endsWith('.fbx')) new FBXLoader().load(fileURL, extractAndSetMesh, undefined, () => { alert("Gagal membaca file!"); hideLoading(); });
                e.target.value = '';
            });

            resetDemoBtn.addEventListener('click', loadDemoMesh);

            exportObjBtn.addEventListener('click', () => {
                if (!currentMesh) return; const exporter = new OBJExporter(); downloadFile(exporter.parse(currentMesh), 'text/plain', `raw_${slider.value}percent.obj`);
            });

            // --- EKSPOR DENGAN "SAFE" COMPRESSION (UNIVERSAL) ---
            exportGlbBtn.addEventListener('click', () => {
                if (!currentMesh) return;
                showLoading("Menyiapkan Kompresi Aman...");
                
                const prevMode = toolView.className === 'active-tool' ? 'view' : transformControl.mode;
                transformControl.detach(); 
                const tempMaterial = currentMesh.material;
                currentMesh.material = loadedMaterial; 

                const exporter = new GLTFExporter();
                exporter.parse(
                    scene, 
                    async function (gltfArrayBuffer) {
                        try {
                            const io = new WebIO().registerExtensions(KHRONOS_EXTENSIONS);
                            const document = await io.readBinary(new Uint8Array(gltfArrayBuffer));
                            
                            // Transformasi aman: Tanpa Meshopt, hanya membersihkan & merampingkan data
                            await document.transform(
                                prune(),     
                                dedup(),     
                                weld({ tolerance: 0.0001 }), 
                                quantize({
                                    quantizePosition: 14, // Presisi aman
                                    quantizeTexcoord: 12,
                                    quantizeColor: 8,
                                    quantizeNormal: 8
                                })
                            );

                            const compressedGlbBuffer = await io.writeBinary(document);
                            
                            downloadFile(compressedGlbBuffer, 'application/octet-stream', `Safe_${slider.value}percent.glb`);
                        } catch (error) {
                            console.error("Kompresi Gagal:", error); 
                            alert("Gagal melakukan kompresi data: " + error.message); 
                        } finally {
                            currentMesh.material = tempMaterial;
                            if (prevMode !== 'view') transformControl.attach(currentMesh);
                            hideLoading();
                        }
                    },
                    function (error) {
                        currentMesh.material = tempMaterial; if (prevMode !== 'view') transformControl.attach(currentMesh);
                        console.error(error); alert("Gagal mengekspor GLB mentah."); hideLoading();
                    },
                    // KUNCI: Tetap me-limit ukuran tekstur untuk menghemat belasan Megabyte
                    { binary: true, maxTextureSize: 1024 } 
                );
            });
        }

        function downloadFile(data, mimeType, filename) {
            const blob = new Blob([data], { type: mimeType });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = filename;
            document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(link.href);
        }

        function updateStats(origCount, currCount) {
            document.getElementById('origVerts').textContent = origCount.toLocaleString();
            document.getElementById('currVerts').textContent = currCount.toLocaleString();
            const pct = origCount > 0 ? Math.round(((origCount - currCount) / origCount) * 100) : 0;
            document.getElementById('reducedPct').textContent = `${pct}%`;
        }

        function showLoading(text) { loadingText.textContent = text; loadingOverlay.style.display = 'flex'; }
        function hideLoading() { loadingOverlay.style.display = 'none'; }
        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

        init();
    </script>
</body>
</html>
